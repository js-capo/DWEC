<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // 4. Object.create()
        const personaProto = {
            saludar: function() {
                console.log(`Hola, soy ${this.nombre}`);
            }
        };

        const juan = Object.create(personaProto);
        juan.nombre = "Juan";
        juan.edad = 30;
        juan.saludar(); // "Hola, soy Juan"   
    </script>
</body>
</html>
