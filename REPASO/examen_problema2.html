<!DOCTYPE html>
<html lang="es">
<head>
  <!-- Required meta tags -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css"
      integrity="sha384-TX8t27EcRE3e/ihU7zmQxVncDAy5uIKz4rEkgIXeMed4M0jlfIDPvg6uqKI2xXr2" crossorigin="anonymous">
  <script src="examen_problema2.js"></script>
  <title>Problema 2 - Criptomonedas</title>
</head>
<body onload="inicializar()">
  <div class="container-fluid p-5 text-center">
    <div class="row">
      <div class="col-6 fondo-azul-cielo">
        <h5 class="pt-3 pb-3">Listado de criptomonedas</h5>
        <table class="table table-dark table-striped table-bordered">
          <thead>
            <th>Simbolo</th>
            <th>Nombre</th>
            <th>ID</th>
            <th>Acciones</th>
          </thead>
          <tbody id="tbodyCriptomonedas">
          <!-- aqui se interaran los tr para cada fila -->
          </tbody>
        </table>
      </div>
      <div class="col-6 fondo-azul-claro">
        <h5 class="pt-3 pb-3">Detalle de la criptomoneda</h5>
        <div id="contenedorTarjetaCriptomoneda" class="d-flex justify-content-center">
        <!-- aqui se insertara la tarjeta con el detalle de una criptomoneda -->
        </div>
      </div>
    </div>
  </div>
  <script src="examen_problema2.js"></script>
  <style>
    tr {
      cursor: pointer;
    }

    .fondo-azul-cielo {
      background-color: skyblue;
      border: 0.25em solid;
    }

    .fondo-azul-claro {
      background-color: lightskyblue;
      border: 0.25em solid;
    }
  </style>
</body>
</html>
