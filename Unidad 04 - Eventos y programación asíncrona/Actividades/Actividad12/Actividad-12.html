<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monumentos de Bizkaia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            transition: background-color 0.3s ease;
        }

        .dark {
            background-color: black;
        }

        .dark h1,
        .dark .card-title,
        .dark .card-text {
            color: white;
        }

        .dark .card {
            background-color: #1f1f1f;
            border-color: #444;
            color: white;
        }
    </style>
</head>
<body>
    <main class="container py-5">
        <h1 class="text-center mb-4">Monumentos para ver en Bizkaia</h1>

        <div class="d-flex justify-content-center gap-3 mb-4">
            <button id="botonOscuro" class="btn btn-dark">Oscuro</button>
            <button id="botonClaro" class="btn btn-light border">Claro</button>
        </div>

        <div id="cards" class="card-columns"></div>
    </main>

    <script src="Actividad-12.js"></script>
</body>
</html>
