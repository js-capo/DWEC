<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiempo en Bilbao</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #f4f7fb;
        }

        .weather-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        .forecast-card {
            background: white;
            border-radius: 12px;
            min-height: 170px;
        }

        .icon-weather {
            width: 64px;
            height: 64px;
        }
    </style>
</head>
<body>
    <main class="container py-5">
        <h1 class="text-center mb-4">Tiempo en Bilbao</h1>
        <section id="tiempo-actual" class="mb-5"></section>

        <section>
            <h2 class="h4 mb-3">Próximos 5 días</h2>
            <div id="forecast" class="row g-3"></div>
        </section>
    </main>

    <script src="Actividad-13.js"></script>
</body>
</html>
