<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
            
        let juan = {
            nombre : "Juan",
            curso : "DAW2",
            edad : 20
        }
        let ana = new Object(); // let ana = {}
        ana.nombre = "Ana";
        ana["curso"] = "DAW2";
        ana.edad = 23;
        for(let p in juan){
            console.log(`${p} : ${juan[p]}`);
        }
        if (juan.edad > ana.edad){
            console.log("Juan es el mayor");
        } else if (juan["edad"]<ana["edad"]){
            console.log("Ana es la mayor");
        } else {
            console.log("Ana y Juan tienen la misma edad");
        }
        let nota1 = {
            asignatura : "DWEC",
            nota : 8
        }
        juan.dwec = nota1;
        juan.dwes = {
            asignatura : "DWES",
            nota : 8
        }
        let asignatura = "DWES";
        let nota = 8;
        ana.dwes = {
            asignatura  ,
            nota
        }
        ana.dwec = new Object();
        ana.dwec.asignatura = "DWEC";
        ana.dwec.nota = 8;
        asignatura = "EIE";
        nota = 8;
        ana.eie = {
            asignatura,
            nota
        }
        const mediaJuan = (juan.dwec.nota + juan.dwes.nota) / 2;
        const mediaAna = (ana.dwec.nota + ana.dwes.nota + ana.eie.nota) / 3;
        console.log(`${mediaJuan==mediaAna?"Tienen la misma nota":(mediaAna>mediaJuan?"Ana":"Juan") + " tiene mejor nota media"}`);
        delete juan.edad;
        ana.dwec.profesor = { nombre : 'Iñigo'}
        mostrarAlumno(ana);
        mostrarAlumno(juan);


        function mostrarAlumno(alumno){
            for(let p in alumno){
        // cuando imprime un objeto, imprime object object
                if (typeof alumno[p] == "object"){
                    console.log(`${p}`);
                    for (let prop in alumno[p]){
                        console.log(`${prop} : ${alumno[p][prop]}`);    
                    }
                    mostrarAlumno(alumno[p]);
                } else {
                    console.log(`${p} : ${alumno[p]}`);
                }
            }
        }

    </script>
</body>
</html>
